<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #0a0e27, #1a1f3a);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        let angle = 0;
        // 雪花数组
        let snow = [];
    // 地面雪堆（每像素列的累积高度）
    let groundAccum = [];
    let groundY = Math.floor(canvas.height * 0.85);

        class Particle {
            constructor(x, y, z) {
                this.x = x;
                this.y = y;
                this.z = z;
                    // 根据用途设定视觉半径和颜色
                    if (y < -80) {
                        // 顶部星星 — 稍大些
                        this.color = `rgba(255, 215, 0, ${Math.random() * 0.5 + 0.5})`;
                        this.radius = Math.random() * 1.5 + 2.5; // 星星视觉较大
                    } else {
                        // 叶子 — 更小但更多
                        this.color = `rgba(50, 200, 50, ${Math.random() * 0.3 + 0.3})`;
                        this.radius = Math.random() * 0.9 + 0.5; // 0.5 ~ 1.4
                    }
            }
            
            // 绘制粒子
            draw(rotatedX, rotatedZ) {
                // 透视效果:距离越远,粒子越小
                const scale = 400 / (400 + rotatedZ);
                const x2d = rotatedX * scale + canvas.width / 2;
                const y2d = this.y * scale + canvas.height / 2;
                const r = this.radius * scale;
                
                // 如果是装饰球, 给它发光效果
                if (this.isOrnament) {
                    ctx.save();
                    ctx.shadowBlur = Math.max(6, r * 1.5);
                    ctx.shadowColor = this.color;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(x2d, y2d, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    return;
                }

                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(x2d, y2d, r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createTree() {
            particles = [];  // 清空粒子数组
            // 重新计算地面高度
            groundY = Math.floor(canvas.height * 0.85);
            // 初始化groundAccum为画布宽度的0数组
            groundAccum = new Array(canvas.width).fill(0);
            
            // 1. 创建树的主体(圆锥形)
            for (let i = 0; i < 12000; i++) {
                const angle = Math.random() * Math.PI * 2;
                const y = Math.random() * 240 - 100; // -100 ~ +100
                const maxRadius = (y + 100) * 0.5; // 根据高度计算最大半径
                const radius = Math.random() * maxRadius;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                
                particles.push(new Particle(x, y, z));
            }   
            // 装饰球：只放在树的外壳附近，多种颜色
            (function createOrnaments(){
                const ornamentColors = [
                    'rgba(255,80,80,1)',   // 红
                    'rgba(255,215,0,1)',   // 金
                    'rgba(255,105,180,1)', // 粉
                    'rgba(80,200,255,1)',  // 蓝
                    'rgba(255,255,255,1)'  // 白
                ];
                const ornamentCount = 100; // 装饰球数量，可调整
                for (let i = 0; i < ornamentCount; i++) {
                    const y = Math.random() * 220 - 100; // 与树主体同高度范围
                    const maxRadius = (y + 100) * 0.5;
                    if (maxRadius <= 2) continue; // 顶端太窄不放

                    const angle = Math.random() * Math.PI * 2;
                    // 放在外壳附近 (0.9~1.0倍 maxRadius)
                    const posRadius = maxRadius * (0.9 + Math.random() * 0.1);
                    const x = Math.cos(angle) * posRadius;
                    const z = Math.sin(angle) * posRadius;

                    const p = new Particle(x, y, z);
                    // 颜色与大小覆盖为装饰球样式
                    p.color = ornamentColors[Math.floor(Math.random() * ornamentColors.length)];
                    p.radius = Math.random() * 1.5 + 2.5; // 略大一些
                    p.isOrnament = true;
                    particles.push(p);
                }
            })();
            
            // 2. 创建顶部的星星
            for (let i = 0; i < 50; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 10;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                const y = -100 - Math.random() * 30;
                
                // 放大星星位置半径
                particles.push(new Particle(x, y, z));
            }
            
            // 3. 创建树干
            for (let i = 0; i < 800; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 15;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                const y = 120 + Math.random() * 100;  // 在树底部
                
                particles.push(new Particle(x, y, z));
            }
            // 初始化或重置雪花
            createSnow(220);
        }

        // 创建雪花
        function createSnow(count) {
            snow = [];
            for (let i = 0; i < count; i++) {
                snow.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 2 + 0.8,
                    speed: Math.random() * 1.2 + 0.3
                });
            }
            // 初始化地面累积数组
            groundAccum = new Array(canvas.width).fill(0);
        }

        function animate() {
            // 清空画布(半透明黑色,产生拖尾效果)
            ctx.fillStyle = 'rgba(10, 14, 39, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 增加旋转角度
            angle += 0.005;
            
            // 遍历每个粒子
            particles.forEach(particle => {
                // 3D旋转变换(绕Y轴旋转)
                const cosA = Math.cos(angle);
                const sinA = Math.sin(angle);
                
                // 旋转公式
                const rotatedX = particle.x * cosA - particle.z * sinA;
                const rotatedZ = particle.x * sinA + particle.z * cosA;
                
                // 绘制粒子
                particle.draw(rotatedX, rotatedZ);
            });
            // 绘制并更新雪花（在最上层）
            ctx.save();
            for (let i = 0; i < snow.length; i++) {
                const s = snow[i];
                s.y += s.speed;
                // 若到达或低于地面减去当前累积高度, 则积雪
                const xi = Math.max(0, Math.min(canvas.width - 1, Math.floor(s.x)));
                const groundH = groundAccum[xi] || 0;
                if (s.y + s.r >= groundY - groundH) {
                    // 增加该列的累积高度
                    groundAccum[xi] = groundH + Math.min(2, s.r);
                    // 重置雪花到顶部
                    s.y = -s.r;
                    s.x = Math.random() * canvas.width;
                    continue;
                }
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // 绘制地面积雪（逐列渲染）
            ctx.save();
            ctx.fillStyle = 'white';
            for (let x = 0; x < canvas.width; x++) {
                const h = groundAccum[x] || 0;
                if (h > 0) ctx.fillRect(x, groundY - h, 1, h);
            }
            ctx.restore();
            
            // 继续下一帧动画
            requestAnimationFrame(animate);
        }
        // 窗口大小改变时重新设置canvas
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // 重新生成雪花以匹配新大小
            createSnow(snow.length || 220);
            // 重新计算地面高度
            groundY = Math.floor(canvas.height * 0.85);
        });
        
        // 启动程序
        createTree();  // 创建圣诞树
        animate();     // 开始动画

    </script>
</body>
</html>
